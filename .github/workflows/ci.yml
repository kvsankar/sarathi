name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Ruff check
        run: uv run ruff check checkers tests

      - name: Ruff format check
        run: uv run ruff format --check checkers tests

      - name: Markdown check
        run: >
          uv run pymarkdown --enable-extensions front-matter,markdown-tables
          --set 'plugins.md024.siblings_only=$!true'
          -d md013 scan AGENTS.md prompts skills docs

      - name: Python and skill tests
        run: >
          uv run pytest -q --cov=checkers --cov-report=term-missing
          --cov-fail-under=80

      - name: Detect layout-related changes
        id: layout
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            checkers tests/browser package.json package-lock.json .github/workflows/ci.yml; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install browser test dependencies
        if: steps.layout.outputs.required == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.layout.outputs.required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Browser layout tests
        if: steps.layout.outputs.required == 'true'
        run: npm run test:layout
