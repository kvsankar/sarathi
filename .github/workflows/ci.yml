name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 22.14.0
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node and document checks
        run: npm run check:fast

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser layout tests
        run: npm run test:layout

      - name: Inspect npm package
        run: npm pack --dry-run --json

  windows-install:
    name: Windows package and installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test package and installers
        run: npm run test:distribution && npm run test:installers

  macos-install:
    name: macOS package and installer
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test package and installers
        run: npm run test:distribution && npm run test:installers
